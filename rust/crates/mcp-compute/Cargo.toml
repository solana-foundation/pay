[package]
name = "mcp-compute"
description = "Provider-neutral serverless compute MCP with pluggable deployment drivers"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "mcp-compute"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
axum = { workspace = true }
base64 = { workspace = true }
bs58 = { workspace = true }
bytes = "1"
chrono = { workspace = true }
clap = { workspace = true, features = ["env"] }
futures-util = "0.3"
http = "1"
reqwest = { workspace = true, features = ["json"] }
redis = { version = "0.32", features = ["aio", "tokio-comp", "connection-manager"] }
rmcp = { workspace = true, features = ["server", "transport-streamable-http-server"] }
schemars = "1.2"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = "2"
zip = { version = "4", default-features = false, features = ["deflate"] }

[dev-dependencies]
rcgen = "0.14"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tower = { version = "0.5", features = ["util"] }
