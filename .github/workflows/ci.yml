name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  pull-requests: write

jobs:
  # ── TypeScript SDK ──
  core-test:
    name: TypeScript tests + coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./typescript
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: pnpm install
      - run: cd packages/solana-pay/core && npx vitest run --coverage
      - name: Upload TS coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ts-coverage
          path: typescript/packages/solana-pay/core/coverage/coverage-summary.json
          if-no-files-found: ignore

  # ── Rust lint ──
  rust-check:
    name: Rust lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./rust
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Build PDB frontend
        run: cd ../web-ui && pnpm install --frozen-lockfile && pnpm build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install libudev (ledger feature)
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --workspace --all-targets --features pay/ledger,pay-core/ledger -- -D warnings

  deployment-payments:
    name: Deployment payments (local chain)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@just
      - uses: ./.github/actions/install-surfpool
      - name: Install local test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server libssl-dev pkg-config cmake
          curl --fail --location --silent --show-error \
            https://release.anza.xyz/v3.1.13/install --output "${RUNNER_TEMP}/install-anza.sh"
          sh "${RUNNER_TEMP}/install-anza.sh"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: deployment-e2e
      - run: just deployment-test-safety
      - run: just deployment-test-program
      - run: just deployment-test
      - name: Upload local service diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-payment-diagnostics
          path: |
            rust/target/deployment-e2e/*.log
            rust/target/deployment-e2e/*.fixture.json
          if-no-files-found: ignore

  # ── Windows Rust check ──
  rust-windows-check:
    name: Rust check (Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ./rust
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Build PDB frontend
        run: cd ../web-ui && pnpm install --frozen-lockfile && pnpm build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: check-windows
      - run: cargo check -p pay --features ledger

  # ── Rust tests + coverage ──
  rust-test:
    name: Rust tests + coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./rust
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Build PDB frontend
        run: cd ../web-ui && pnpm install --frozen-lockfile && pnpm build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Install Surfpool CLI
        uses: ./.github/actions/install-surfpool
      - name: Install libudev (ledger feature)
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Run tests with coverage
        env:
          SURFPOOL_REPORT: "1"
        run: cargo llvm-cov --workspace --features server,pay-core/ledger --exclude pay --ignore-filename-regex 'crates/cli/' --json --output-path coverage.json
      - name: Upload Rust coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-coverage
          path: rust/coverage.json
      - name: Upload Rust surfpool report data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surfpool-reports-rust
          path: rust/target/surfpool-reports/
          if-no-files-found: ignore
